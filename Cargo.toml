[package]
name = "backlog-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
clap = { version = "=4.5.54", features = ["derive"] }
crossterm = "=0.29.0"
pulldown-cmark = "=0.13.5"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["arbitrary_precision", "raw_value"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process"] }
tui-input = { version = "=0.15.5", default-features = false, features = ["crossterm"] }
